name: A5-64p-CI

run-name: "${{ github.workflow }} | test=${{ inputs.test_case }}"

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: "Registered Integration Test ID (tests/integration_tests/ci_registry.json)"
        type: string
        required: true
        default: "dsv4_pro_a5_64p"

permissions:
  contents: read

concurrency:
  group: a5-64p-ci
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    if: github.actor == 'depeng1994' && github.repository == 'depeng1994/torchtitan-npu' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Wait for internal A5-64p-CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WAIT_TIMEOUT_SECONDS: "14900"
        run: python3 .github/scripts/ci-wait-result.py --case a5-64p
