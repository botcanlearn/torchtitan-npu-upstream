name: A5-64p-CI

run-name: "${{ github.workflow }}"

on:
  workflow_dispatch:
    inputs:
      test_cases:
        description: 'JSON test list: path, test_id, params (1-12 cases)'
        type: string
        required: true
        default: '[{"path":"tests/integration_tests/nightly_all_models_test/a5_64p_tests.py","test_id":"dsv4_pro_a5_64p","params":{}}]'

permissions:
  contents: read
  actions: read

concurrency:
  group: a5-64p-ci
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Prepare CI request
    if: github.actor == 'depeng1994' && github.repository == 'depeng1994/torchtitan-npu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow_dispatch inputs
        env:
          CI_TEST_CASES: ${{ inputs.test_cases }}
        run: python3 .github/scripts/prepare-ci-request.py
      - name: Upload CI request
        uses: actions/upload-artifact@v4
        with:
          name: lite-ci-request-${{ github.run_attempt }}
          path: .ci-request/ci-request.json
          retention-days: 1
          if-no-files-found: error
  ci:
    needs: prepare
    name: CI tests
    if: github.actor == 'depeng1994' && github.repository == 'depeng1994/torchtitan-npu' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Wait for internal A5-64p-CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WAIT_TIMEOUT_SECONDS: "14900"
        run: python3 .github/scripts/ci-wait-result.py --case a5-64p
