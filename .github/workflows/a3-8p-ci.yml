name: A3-8p-CI-Example

run-name: "${{ github.workflow }} | test=${{ inputs.test_case }}"

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: "Registered Integration Test ID (tests/integration_tests/ci_registry.json)"
        type: string
        required: true
        default: "dsv4_flash_a3_8p_example"

permissions:
  contents: read

concurrency:
  group: a3-8p-ci
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    if: github.actor == 'depeng1994' && github.repository == 'depeng1994/torchtitan-npu' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/refactor/unified-a3-a5-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Wait for internal A3-8p-CI-Example
        env:
          GH_TOKEN: ${{ github.token }}
          A3_CI_TIMEOUT_SECONDS: "7400"
        run: python3 .github/scripts/a3-ci-wait-result.py --case a3-8p
